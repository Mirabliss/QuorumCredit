# Issue #1280: This file documents ONLY the REST endpoints that
# server/src/http/routes.ts (and webhookRoutes.ts) actually serve.
# It was previously inflated with 51 Soroban contract function paths
# that 404'd in every real deployment.
#
# Source of truth: server/src/http/routes.ts
# CI drift check: .github/workflows/openapi-drift.yml
openapi: "3.0.3"
info:
  title: QuorumCredit Broadcast Server API
  description: |
    REST API served by the QuorumCredit broadcast/relay server
    (`server/src/index.ts`).

    This spec covers **only** the HTTP routes registered in
    `server/src/http/routes.ts` and `server/src/http/webhookRoutes.ts`.
    Soroban contract functions (vouch, request_loan, repay, etc.) are
    invoked via the Stellar RPC directly — they are not wrapped as REST
    endpoints here. See `docs/openapi.yaml` for the contract-function
    reference (RPC-style).
  version: "2.0.0"
  license:
    name: MIT

servers:
  - url: http://localhost:3000
    description: Local development
  - url: https://api.quorumcredit.xyz
    description: Production

tags:
  - name: health
    description: Liveness and readiness probes
  - name: metrics
    description: Prometheus metrics scrape endpoint
  - name: auth
    description: API token issuance
  - name: expenses
    description: Loan expense tracking
  - name: recurring-payments
    description: Recurring repayment schedules
  - name: webhooks
    description: Webhook registration and management

paths:
  # ── Health ──────────────────────────────────────────────────────────────────
  /health:
    get:
      tags: [health]
      summary: Health check
      description: Returns `{ "status": "ok" }` when the server is running.
      operationId: getHealth
      responses:
        "200":
          description: Server is healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"

  # ── Metrics ─────────────────────────────────────────────────────────────────
  /metrics:
    get:
      tags: [metrics]
      summary: Prometheus metrics
      description: Exposes internal counters in Prometheus text format.
      operationId: getMetrics
      responses:
        "200":
          description: Prometheus text exposition format
          content:
            text/plain:
              schema:
                type: string

  # ── Auth ────────────────────────────────────────────────────────────────────
  /api/auth/token:
    post:
      tags: [auth]
      summary: Issue a JWT
      description: |
        Exchange an API key for a short-lived JWT used to authenticate
        subsequent requests. In production you must replace the
        placeholder credential check with a real API-key store lookup.
      operationId: issueToken
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TokenRequest"
      responses:
        "200":
          description: Token issued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenResponse"
        "400":
          description: Missing or invalid apiKey
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  # ── Loan Expenses ───────────────────────────────────────────────────────────
  /loans/{loanId}/expenses:
    parameters:
      - $ref: "#/components/parameters/LoanId"
    post:
      tags: [expenses]
      summary: Record a loan expense
      operationId: addExpense
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExpenseRequest"
      responses:
        "201":
          description: Expense recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Expense"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    get:
      tags: [expenses]
      summary: List expenses for a loan
      operationId: listExpenses
      responses:
        "200":
          description: List of expenses
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Expense"

  /loans/{loanId}/expense-breakdown:
    parameters:
      - $ref: "#/components/parameters/LoanId"
    get:
      tags: [expenses]
      summary: Expense breakdown by category
      operationId: getExpenseBreakdown
      responses:
        "200":
          description: Category totals
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExpenseBreakdown"

  # ── Recurring Payments ──────────────────────────────────────────────────────
  /loans/{loanId}/recurring-payment:
    parameters:
      - $ref: "#/components/parameters/LoanId"
    post:
      tags: [recurring-payments]
      summary: Set up a recurring repayment schedule
      operationId: setupRecurringPayment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RecurringPaymentRequest"
      responses:
        "201":
          description: Schedule created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecurringPaymentSchedule"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    get:
      tags: [recurring-payments]
      summary: Get the recurring payment schedule for a loan
      operationId: getRecurringPayment
      responses:
        "200":
          description: Schedule details with success rate
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecurringPaymentSchedule"
        "404":
          description: No schedule found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      tags: [recurring-payments]
      summary: Terminate a recurring payment schedule
      operationId: terminateRecurringPayment
      responses:
        "200":
          description: Schedule terminated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TerminateResponse"
        "404":
          description: No schedule found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /loans/{loanId}/recurring-payment/execute:
    parameters:
      - $ref: "#/components/parameters/LoanId"
    post:
      tags: [recurring-payments]
      summary: Manually trigger a due recurring payment
      operationId: executeRecurringPayment
      responses:
        "200":
          description: Execution result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecurringPaymentResult"
        "500":
          description: Unexpected execution failure
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  # ── Webhooks ────────────────────────────────────────────────────────────────
  /api/webhooks/register:
    post:
      tags: [webhooks]
      summary: Register a new webhook endpoint
      operationId: registerWebhook
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterWebhookRequest"
      responses:
        "201":
          description: Webhook registered — secret returned once only
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebhookRegistration"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/webhooks:
    get:
      tags: [webhooks]
      summary: List all registered webhooks (secrets redacted)
      operationId: listWebhooks
      responses:
        "200":
          description: Array of webhook registrations
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/WebhookSummary"

  /api/webhooks/{webhookId}:
    parameters:
      - $ref: "#/components/parameters/WebhookId"
    get:
      tags: [webhooks]
      summary: Get a single webhook registration
      operationId: getWebhook
      responses:
        "200":
          description: Webhook details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebhookSummary"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    put:
      tags: [webhooks]
      summary: Update a webhook registration
      operationId: updateWebhook
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateWebhookRequest"
      responses:
        "200":
          description: Updated webhook
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebhookSummary"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      tags: [webhooks]
      summary: Delete a webhook registration
      operationId: deleteWebhook
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeletedResponse"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/webhooks/{webhookId}/test:
    parameters:
      - $ref: "#/components/parameters/WebhookId"
    post:
      tags: [webhooks]
      summary: Send a test event to a registered webhook
      operationId: testWebhook
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TestWebhookRequest"
      responses:
        "200":
          description: Test delivery result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TestWebhookResponse"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /webhook:
    post:
      tags: [webhooks]
      summary: Receive an incoming signed webhook
      description: |
        Endpoint for receiving externally-posted webhook events.
        Validates the `X-Webhook-Signature` header against the configured
        `webhookSecret`.
      operationId: receiveWebhook
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        "200":
          description: Event processed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebhookReceiveResponse"
        "401":
          description: Invalid signature
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

# ── Components ──────────────────────────────────────────────────────────────
components:
  parameters:
    LoanId:
      name: loanId
      in: path
      required: true
      description: Loan identifier (string)
      schema:
        type: string
    WebhookId:
      name: webhookId
      in: path
      required: true
      description: Webhook registration identifier
      schema:
        type: string

  schemas:
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: string

    HealthResponse:
      type: object
      required: [status]
      properties:
        status:
          type: string
          example: ok

    TokenRequest:
      type: object
      required: [apiKey]
      properties:
        apiKey:
          type: string
        borrower:
          type: string
          description: Optional borrower address to embed in the JWT

    TokenResponse:
      type: object
      required: [token]
      properties:
        token:
          type: string
          description: Signed JWT

    ExpenseRequest:
      type: object
      required: [category, amount]
      properties:
        category:
          type: string
          enum: [business, education, healthcare, other]
        amount:
          type: number
          minimum: 0
          exclusiveMinimum: true
        description:
          type: string
        declaredPurpose:
          type: string

    Expense:
      type: object
      properties:
        id:
          type: string
        loanId:
          type: string
        category:
          type: string
        amount:
          type: number
        description:
          type: string
        createdAt:
          type: integer
          format: int64

    ExpenseBreakdown:
      type: object
      additionalProperties:
        type: number
      description: Map of category → total amount

    RecurringPaymentRequest:
      type: object
      required: [amount, frequencySeconds]
      properties:
        amount:
          type: number
          minimum: 0
          exclusiveMinimum: true
        frequencySeconds:
          type: number
          minimum: 0
          exclusiveMinimum: true
        startDate:
          type: integer
          format: int64
          description: Unix epoch milliseconds; defaults to now

    RecurringPaymentSchedule:
      type: object
      properties:
        loanId:
          type: string
        amount:
          type: number
        frequencySeconds:
          type: number
        startDate:
          type: integer
          format: int64
        active:
          type: boolean
        successRateBps:
          type: integer
          description: Success rate in basis points (0–10000)

    TerminateResponse:
      type: object
      required: [loanId, active]
      properties:
        loanId:
          type: string
        active:
          type: boolean
          example: false

    RecurringPaymentResult:
      type: object
      required: [ok]
      properties:
        ok:
          type: boolean
        message:
          type: string

    RegisterWebhookRequest:
      type: object
      required: [url, events]
      properties:
        url:
          type: string
          format: uri
        events:
          type: array
          items:
            type: string
            enum:
              - loan.requested
              - loan.disbursed
              - loan.repaid
              - loan.defaulted
              - vouch.created
              - vouch.withdrawn
              - slash.executed
              - config.updated

    UpdateWebhookRequest:
      type: object
      properties:
        url:
          type: string
          format: uri
        events:
          type: array
          items:
            type: string
        enabled:
          type: boolean

    WebhookRegistration:
      type: object
      properties:
        id:
          type: string
        url:
          type: string
        events:
          type: array
          items:
            type: string
        secret:
          type: string
          description: Signing secret — only returned at registration time
        message:
          type: string

    WebhookSummary:
      type: object
      properties:
        id:
          type: string
        url:
          type: string
        events:
          type: array
          items:
            type: string
        enabled:
          type: boolean
        createdAt:
          type: integer
          format: int64

    DeletedResponse:
      type: object
      properties:
        deleted:
          type: boolean

    TestWebhookRequest:
      type: object
      required: [event]
      properties:
        event:
          type: string
        data:
          type: object
          additionalProperties: true

    TestWebhookResponse:
      type: object
      properties:
        success:
          type: boolean
        statusCode:
          type: integer

    WebhookReceiveResponse:
      type: object
      properties:
        received:
          type: boolean
